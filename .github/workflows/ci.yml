name: Wrapchik checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Backend clean install and tests
        working-directory: backend
        run: npm ci && npm test
      - name: Frontend clean install and tests
        working-directory: frontend
        run: npm ci && npm test && npm run check:routes
      - name: Check native update runtime compatibility
        working-directory: frontend
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          if [[ "$BASE_REF" =~ ^0+$ ]]; then BASE_REF="HEAD^"; fi
          node scripts/check-native-runtime.cjs --base="$BASE_REF"
      - name: Scan Git-visible source for high-confidence secrets
        run: node scripts/check-secrets.cjs
      - name: Validate Expo dependency compatibility
        working-directory: frontend
        run: npx expo install --check
      - name: Export web bundle
        working-directory: frontend
        run: npm run export:web
      - name: Export Android JavaScript bundle
        working-directory: frontend
        run: npx expo export --platform android
      - name: Export iOS JavaScript bundle
        working-directory: frontend
        run: npx expo export --platform ios
